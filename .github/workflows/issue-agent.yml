name: Issue agent

# The issue pipeline, driven from the "Strux pipeline" project board:
#   Idle -> Analysis -> Plan review -> Build -> Acceptation
#
# The BOARD is the control plane and the only state. Bas drags cards; nothing else
# is a human input.
#   Idle         Nothing runs and no Claude credits are spent. New issues land here.
#   Analysis     Claude reads the issue and the code and posts a plan.  -> Plan review
#   Plan review  Bas reads it: drag back to Analysis to redo (comment what to change),
#                to Idle to park, to Build to approve.
#   Build        Claude implements the plan on agent/issue-<N> and opens a PR. The
#                existing CI, reviewers and automerge take it from there; a failed
#                review or CI run gets up to 3 fix rounds.
#   Acceptation  The PR merged and closed the issue. Bas accepts.
# Anything the agent cannot finish (blocked, needs .github/, 3 rounds used) moves
# the card back to Idle with a comment saying why.
#
# How a drag reaches this file: a user-owned project emits no event an Action or
# webhook can see, so the watcher in .github/agent/bridge/ polls the board and
# sends `repository_dispatch`
# (pipeline-stage, {stage, issue}) when a card is moved into Analysis
# or Build. The agent never moves a card there, so its own moves start nothing.
#
# Tokens: Claude itself only gets the read-mostly GITHUB_TOKEN. Pushing, opening
# PRs, comments and the board use AGENT_PAT (classic PAT, `repo` + `project`) in
# shell steps after Claude is done. A PR opened with GITHUB_TOKEN starts no
# workflows, and GITHUB_TOKEN cannot reach a project.
#
# Build never changes .github/: that is the review mechanism's trust boundary
# (see claude-review.yml). A diff that touches it is not pushed.

on:
  repository_dispatch:
    types: [pipeline-stage]
  issues:
    types: [opened, closed]
  workflow_run:
    workflows: ["Claude PR review", "CI"]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  id-token: write

# No workflow-level GH_TOKEN: Claude's steps must not inherit the PAT. Every
# shell step that needs it names it.
env:
  PROJECT_ID: ${{ vars.PIPELINE_PROJECT_ID }}

jobs:
  # ---------------------------------------------------------------- board upkeep
  # New issue -> Idle; issue closed while in Build (its PR merged) -> Acceptation.
  # Plain shell, seconds of runner time, no Claude.
  board:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    concurrency:
      group: agent-board-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/agent
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          board() { bash .github/agent/board.sh "$ISSUE" "$@"; }
          if [ "$ACTION" = opened ]; then
            board Idle
          elif [ "$(board get)" = Build ]; then
            board Acceptation
          fi

  # ---------------------------------------------------------------- analysis
  analysis:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.stage == 'analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-issue-${{ github.event.client_payload.issue }}
      cancel-in-progress: true
    env:
      ISSUE: ${{ github.event.client_payload.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 50

      - name: Claude analysis
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.client_payload.issue }}

            Read .github/agent/analysis.md and follow it exactly.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Grep,Glob,Write(/tmp/agent/**),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(mkdir -p /tmp/agent)"

      - name: Post the plan and move to Plan review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          R=$GITHUB_REPOSITORY
          if [ -s /tmp/agent/plan.md ]; then
            { cat /tmp/agent/plan.md; echo; echo "<!-- agent-plan -->"; } > /tmp/agent/comment.md
            gh issue comment "$ISSUE" --repo "$R" --body-file /tmp/agent/comment.md
            bash .github/agent/board.sh "$ISSUE" "Plan review"
          else
            gh issue comment "$ISSUE" --repo "$R" --body "Analysis did not produce a plan ([run]($GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID)). Back to Idle."
            bash .github/agent/board.sh "$ISSUE" Idle
          fi

  # ---------------------------------------------------------------- build
  build:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.stage == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-issue-${{ github.event.client_payload.issue }}
      cancel-in-progress: true
    env:
      ISSUE: ${{ github.event.client_payload.issue }}
      BRANCH: agent/issue-${{ github.event.client_payload.issue }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/agent/setup
      - run: git switch -C "$BRANCH"

      - name: Claude build
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.client_payload.issue }}
            BRANCH: agent/issue-${{ github.event.client_payload.issue }} (already checked out)

            Read .github/agent/build.md and follow it exactly.
          claude_args: |
            --max-turns 150
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash"

      - name: Push and open the PR, or return to Idle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: bash .github/agent/publish.sh build

  # ---------------------------------------------------------------- fix loop
  # A failed review or CI run on an agent branch. Skips a stale run (the branch
  # has moved since) and stops after three rounds.
  fix:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-fix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/agent
          persist-credentials: false

      - name: Decide whether to run a round
        id: gate
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: |
          R=$GITHUB_REPOSITORY
          ISSUE=${BRANCH#agent/issue-}; echo "ISSUE=$ISSUE" >> "$GITHUB_ENV"
          pr=$(gh pr list --repo "$R" --head "$BRANCH" --state open --json number,headRefOid --jq '.[0]')
          [ -n "$pr" ] || { echo "No open PR for $BRANCH."; exit 0; }
          echo "PR=$(jq -r .number <<<"$pr")" >> "$GITHUB_ENV"
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$RUN_SHA" ]; then
            echo "Stale: the branch moved on since this run."; exit 0
          fi
          if gh pr view "$BRANCH" --repo "$R" --json labels --jq '.labels[].name' | grep -qx no-automerge; then
            echo "PR is labelled no-automerge, leaving it."; exit 0
          fi
          rounds=$(gh api "repos/$R/issues/$(jq -r .number <<<"$pr")/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- agent-fix "))] | length')
          if [ "$rounds" -ge 3 ]; then
            gh pr edit "$BRANCH" --repo "$R" --add-label no-automerge
            gh issue comment "$ISSUE" --repo "$R" --body "Three fix rounds used and $FAILED_WORKFLOW still fails on the PR. Back to Idle; the PR is left open with \`no-automerge\`."
            bash .github/agent/board.sh "$ISSUE" Idle
            exit 0
          fi
          echo "ROUND=$((rounds + 1))" >> "$GITHUB_ENV"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          persist-credentials: false
          fetch-depth: 0
      - if: steps.gate.outputs.go == 'true'
        uses: ./.github/agent/setup

      - name: Claude fix round
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ env.ISSUE }}
            PR: ${{ env.PR }}
            HEAD SHA: ${{ github.event.workflow_run.head_sha }}
            FAILED WORKFLOW: ${{ github.event.workflow_run.name }} (run ${{ github.event.workflow_run.id }})
            ROUND: ${{ env.ROUND }} of 3

            Read .github/agent/fix.md and follow it exactly.
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Write,Edit,Grep,Glob,Bash"

      - name: Push the fix, or return to Idle
        if: always() && steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: bash .github/agent/publish.sh fix
